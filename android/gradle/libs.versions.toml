[versions]

kotlin = "2.2.21" # the house Compose/MMD combination
# Atlas: the shared About and Licenses pages are Compose + MMD, as in the other apps.
aboutlibraries = "15.3.0"
mmd = "1.0.2"
maplibre = "13.7.1" # the streamed map
okhttp = "4.12.0" # the version MapLibre itself asks for
androidxActivity = "1.12.0"
androidxCompose = "1.9.5"
androidxMaterial3 = "1.4.0"
googleGuava = "33.6.0-android" # 33.7 requires minSDK 23
huaweiPublish = "1.4.2"
androidMaterial = "1.12.0" # 1.13 Material library version doesn't render properly alpha properties on map buttons, 1.14 requires minSDK 23
jetbrainsKotlinBom = "2.2.21" # Atlas: the stdlib must not be newer than the Kotlin compiler that builds the About
androidGradlePlugin = "8.13.2"
androidToolsDesugar = "2.1.5"
tripletPlayPublisher = "3.13.0"
microgServicesLocation = "0.3.14.250932"
appDevNextAndroidChart = "3.1.0.31" # 4.x requires minSDK 23
dependencyUpdatesPlugin = "0.66.0"

# Testing
robo = "4.16.1"
jUnit = "4.13.2"
mockitoCore = "5.24.0"
androidxTestJUnit = "1.3.0"

# AndroidX
coreKtx = "1.17.0"
androidxCore = "1.17.0" # 1.18 requires minSDK 23
androidxMedia = "1.7.1" # 1.8 requires minSDK 23
androidxCarApp = "1.7.0"
androidxFragment = "1.8.9" # 1.9 requires minSDK 23
androidxAppCompat = "1.7.1" # 1.8 requires minSDK 23
androidxAnnotation = "1.11.0"
androidxCustomView = "1.2.0"
androidxPreference = "1.2.1"
androidxWorkRuntime = "2.10.5"
androidxDocumentFile = "1.1.0"
androidxRecyclerView = "1.4.0"
androidxConstraintLayout = "2.2.2"
androidxLifecycleProcess = "2.9.4" # 2.10 requires minSDK 23

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "androidxCompose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "androidxMaterial3" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "androidxCompose" }
mmd = { module = "com.mudita:MMD", version.ref = "mmd" }
maplibre = { module = "org.maplibre.gl:android-sdk", version.ref = "maplibre" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
google-guava = { module = "com.google.guava:guava", version.ref = "googleGuava" }
android-tools = { module = "com.android.tools.build:gradle", version.ref = "androidGradlePlugin" }
huawei-publish = { module = "ru.cian:huawei-publish-gradle-plugin", version.ref = "huaweiPublish" }
android-material = { module = "com.google.android.material:material", version.ref = "androidMaterial" }
jetbrains-kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "jetbrainsKotlinBom" }
android-tools-desugar = { module = "com.android.tools:desugar_jdk_libs", version.ref = "androidToolsDesugar" }
triplet-play-publisher = { module = "com.github.triplet.gradle:play-publisher", version.ref = "tripletPlayPublisher" }
appdevnext-androidchart = { module = "com.github.AppDevNext:AndroidChart", version.ref = "appDevNextAndroidChart" }
microg-services-location = { module = "org.microg.gms:play-services-location", version.ref = "microgServicesLocation" }

# Testing
junit = { module = "junit:junit", version.ref = "jUnit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robo" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockitoCore" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJUnit" }

# AndroidX
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
androidx-media = { module = "androidx.media:media", version.ref = "androidxMedia" }
androidx-car-app = { module = "androidx.car.app:app", version.ref = "androidxCarApp" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidxFragment" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppCompat" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
androidx-customview = { module = "androidx.customview:customview", version.ref = "androidxCustomView" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "androidxPreference" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "androidxWorkRuntime" }
androidx-documentfile= { module = "androidx.documentfile:documentfile", version.ref ="androidxDocumentFile" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidxRecyclerView" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidxConstraintLayout" }
androidx-car-app-projected = { module = "androidx.car.app:app-projected", version.ref = "androidxCarApp" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidxLifecycleProcess" }

[plugins]
# Builds the Licenses list from the dependency graph (res/raw/aboutlibraries.json).
aboutlibraries-android = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutlibraries" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-library= { id = "com.android.library", version.ref = "androidGradlePlugin" }
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
dependencyUpdates = { id = "io.github.ben-manes.versions", version.ref = "dependencyUpdatesPlugin" }